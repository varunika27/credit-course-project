<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Interactive Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Left Side: Image / Branding -->
            <div class="col-lg-6 d-none d-lg-flex bg-image position-relative align-items-center justify-content-center">
                <div class="overlay position-absolute w-100 h-100"></div>
                <div class="text-white text-center position-relative z-1 p-5 glass-panel rounded-5 shadow-lg mx-5">
                    <h1 class="display-4 fw-bolder mb-3">Discover the Future</h1>
                    <p class="lead fw-light mb-0">Join our community and experience seamless, beautiful, and engaging
                        digital interactions like never before.</p>
                </div>
            </div>

            <!-- Right Side: Login Form -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-light right-panel">
                <div class="w-100 p-4 p-md-5 form-wrapper" style="max-width: 550px;">
                    <div class="text-center mb-5">
                        <div
                            class="logo-circle bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle shadow mb-3">
                            <i class="bi bi-hexagon-fill fs-3"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Welcome Back</h2>
                        <p class="text-muted">Please enter your details to sign in.</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-floating mb-4 custom-input-group">
                            <input type="email" class="form-control rounded-4 px-4" id="emailInput"
                                placeholder="name@example.com" required>
                            <label for="emailInput" class="px-4">Email address</label>
                            <i class="bi bi-envelope input-icon"></i>
                        </div>
                        <div class="form-floating mb-3 custom-input-group position-relative">
                            <input type="password" class="form-control rounded-4 px-4 pe-5" id="passwordInput"
                                placeholder="Password" required>
                            <label for="passwordInput" class="px-4">Password</label>
                            <i class="bi bi-lock input-icon"></i>
                            <button type="button"
                                class="btn btn-link toggle-password position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none me-2">
                                <i class="bi bi-eye-slash-fill fs-5"></i>
                            </button>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 px-1">
                            <div class="form-check custom-checkbox">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted small" for="rememberMe">
                                    Remember me for 30 days
                                </label>
                            </div>
                            <a href="forgot-password.html"
                                class="text-decoration-none small text-primary fw-semibold hover-underline">Forgot
                                Password?</a>
                        </div>

                        <button type="submit"
                            class="btn btn-primary w-100 rounded-4 login-btn shadow-lg py-3 mb-4 fw-bold fs-6">
                            <span class="btn-text">Sign In</span>
                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"
                                aria-hidden="true"></span>
                        </button>

                        <div class="position-relative mb-4 text-center">
                            <hr class="text-muted opacity-25">
                            <span
                                class="position-absolute top-50 start-50 translate-middle bg-light px-3 small text-muted">Or
                                continue with</span>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <button type="button"
                                    class="btn btn-white w-100 rounded-4 py-2 border shadow-sm d-flex align-items-center justify-content-center gap-2 social-btn hover-up">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                        class="bi bi-google" viewBox="0 0 16 16">
                                        <path
                                            d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z" />
                                    </svg>
                                    <span class="fw-semibold text-dark">Google</span>
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button"
                                    class="btn btn-white w-100 rounded-4 py-2 border shadow-sm d-flex align-items-center justify-content-center gap-2 social-btn hover-up">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                        class="bi bi-github" viewBox="0 0 16 16">
                                        <path
                                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                                    </svg>
                                    <span class="fw-semibold text-dark">GitHub</span>
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted mb-0">Don't have an account? <a href="signup.html"
                                class="text-decoration-none fw-bold text-primary hover-underline">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
