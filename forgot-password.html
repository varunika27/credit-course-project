<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Interactive Forgot Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Left Side: Image / Branding -->
            <div class="col-lg-6 d-none d-lg-flex bg-image position-relative align-items-center justify-content-center">
                <div class="overlay position-absolute w-100 h-100"></div>
                <div class="text-white text-center position-relative z-1 p-5 glass-panel rounded-5 shadow-lg mx-5">
                    <h1 class="display-4 fw-bolder mb-3">Forgot Password?</h1>
                    <p class="lead fw-light mb-0">Don't worry, it happens to the best of us. We'll get you back into your account in no time.</p>
                </div>
            </div>

            <!-- Right Side: Reset Form -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-light right-panel">
                <div class="w-100 p-4 p-md-5 form-wrapper" style="max-width: 550px;">
                    <div class="text-center mb-5">
                        <div class="logo-circle bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle shadow mb-3">
                            <i class="bi bi-shield-lock-fill fs-3"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Reset Password</h2>
                        <p class="text-muted">Enter your email address to receive a password reset link.</p>
                    </div>

                    <form id="forgotPasswordForm">
                        <div class="form-floating mb-4 custom-input-group">
                            <input type="email" class="form-control rounded-4 px-4" id="emailInput" placeholder="name@example.com" required>
                            <label for="emailInput" class="px-4">Email address</label>
                            <i class="bi bi-envelope input-icon"></i>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-4 auth-btn shadow-lg py-3 mb-4 fw-bold fs-6">
                            <span class="btn-text">Send Reset Link</span>
                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted mb-0"><i class="bi bi-arrow-left me-1"></i> Back to <a href="index.html" class="text-decoration-none fw-bold text-primary hover-underline">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
