<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; background-color: #ffffff; border-right: 1px solid #e9ecef; }
        .sidebar .nav-link { color: #495057; font-weight: 500; margin-bottom: 0.5rem; border-radius: 0.5rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #f1f3f5; color: #0d6efd; }
        .topbar { background-color: #ffffff; border-bottom: 1px solid #e9ecef; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-4 d-none d-lg-block" style="width: 280px;">
            <div class="d-flex align-items-center mb-5">
                <div class="logo-circle bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle shadow me-3" style="width: 40px; height: 40px;">
                    <i class="bi bi-hexagon-fill fs-5"></i>
                </div>
                <h4 class="fw-bold mb-0 text-dark">MyApp</h4>
            </div>
            
            <ul class="nav flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active px-3 py-2 d-flex align-items-center gap-2">
                        <i class="bi bi-grid-fill"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link px-3 py-2 d-flex align-items-center gap-2">
                        <i class="bi bi-person-fill"></i> Profile
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link px-3 py-2 d-flex align-items-center gap-2">
                        <i class="bi bi-gear-fill"></i> Settings
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 overflow-auto" style="height: 100vh;">
            <!-- Topbar -->
            <div class="topbar px-4 py-3 d-flex justify-content-between align-items-center sticky-top">
                <h4 class="mb-0 fw-bold">Overview</h4>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light rounded-circle position-relative p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-bell fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                            <span class="visually-hidden">New alerts</span>
                        </span>
                    </button>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark fw-semibold" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://ui-avatars.com/api/?name=John+Doe&background=random" alt="mdo" width="40" height="40" class="rounded-circle me-2">
                            John Doe
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="dropdownUser1">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html">Sign out</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="p-4 p-md-5">
                <!-- Welcome Banner -->
                <div class="card bg-primary text-white mb-4 overflow-hidden position-relative">
                    <div class="card-body p-4 p-md-5 position-relative z-1">
                        <h2 class="fw-bold mb-2">Welcome back, John! 👋</h2>
                        <p class="mb-0 text-white-50">Here's what's happening with your account today.</p>
                    </div>
                    <!-- Decorative shapes -->
                    <div class="position-absolute rounded-circle bg-white opacity-10" style="width: 200px; height: 200px; top: -100px; right: -50px;"></div>
                    <div class="position-absolute rounded-circle bg-white opacity-10" style="width: 150px; height: 150px; bottom: -50px; right: 100px;"></div>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card h-100 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="text-muted fw-semibold mb-0">Total Views</h6>
                                <div class="bg-primary bg-opacity-10 text-primary p-2 rounded">
                                    <i class="bi bi-eye-fill"></i>
                                </div>
                            </div>
                            <h2 class="fw-bold mb-1">12,456</h2>
                            <p class="text-success mb-0 small"><i class="bi bi-arrow-up-right me-1"></i> +14.5%</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="text-muted fw-semibold mb-0">Active Users</h6>
                                <div class="bg-success bg-opacity-10 text-success p-2 rounded">
                                    <i class="bi bi-people-fill"></i>
                                </div>
                            </div>
                            <h2 class="fw-bold mb-1">3,890</h2>
                            <p class="text-success mb-0 small"><i class="bi bi-arrow-up-right me-1"></i> +5.2%</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="text-muted fw-semibold mb-0">Conversion Rate</h6>
                                <div class="bg-warning bg-opacity-10 text-warning p-2 rounded">
                                    <i class="bi bi-lightning-charge-fill"></i>
                                </div>
                            </div>
                            <h2 class="fw-bold mb-1">8.4%</h2>
                            <p class="text-danger mb-0 small"><i class="bi bi-arrow-down-right me-1"></i> -1.1%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
